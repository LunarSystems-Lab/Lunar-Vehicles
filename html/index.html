<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <aside id="oil" class="oil" hidden aria-hidden="true">

            <span>OIL</span>

    </aside>
    <script src="app.js"></script>
</body>
</html>
